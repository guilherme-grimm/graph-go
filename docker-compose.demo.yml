services:
  graph-go:
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf/config.docker.yaml:/app/conf/config.yaml:ro
      - backend-data:/app/data
    # The image runs as a non-root user; grant it the Docker socket's group.
    # `graph-go demo` sets DOCKER_GID for you. With plain compose on Linux:
    #   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f docker-compose.demo.yml up
    group_add:
      - "${DOCKER_GID:-0}"
    labels:
      graphgo.ignore: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - graph-go

  # ── Mock application services ──────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/mock-service
    environment:
      SERVICE_NAME: api-gateway
    healthcheck:
      test: ["CMD", "/mock-service", "-health-check"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - graph-go

  user-service:
    build:
      context: ./services/mock-service
    environment:
      SERVICE_NAME: user-service
    healthcheck:
      test: ["CMD", "/mock-service", "-health-check"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - graph-go

  order-service:
    build:
      context: ./services/mock-service
    environment:
      SERVICE_NAME: order-service
    healthcheck:
      test: ["CMD", "/mock-service", "-health-check"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - graph-go

  product-service:
    build:
      context: ./services/mock-service
    environment:
      SERVICE_NAME: product-service
    healthcheck:
      test: ["CMD", "/mock-service", "-health-check"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - graph-go

  media-service:
    build:
      context: ./services/mock-service
    environment:
      SERVICE_NAME: media-service
    healthcheck:
      test: ["CMD", "/mock-service", "-health-check"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - graph-go

  # ── Infrastructure ─────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: graphgo
      POSTGRES_PASSWORD: graphgo
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphgo -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - graph-go

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: graphgo
      MONGO_INITDB_ROOT_PASSWORD: graphgo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - graph-go

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: graphgo
      RUSTFS_SECRET_KEY: graphgo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - graph-go

  # ── Discovery-only backend (no config.yaml) ──────────────────────────
  # Usage: docker compose -f docker-compose.demo.yml --profile discovery up
  graph-go-discovery:
    profiles: ["discovery"]
    build:
      context: .
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backend-data:/app/data
    # The image runs as a non-root user; grant it the Docker socket's group.
    # `graph-go demo` sets DOCKER_GID for you. With plain compose on Linux:
    #   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f docker-compose.demo.yml up
    group_add:
      - "${DOCKER_GID:-0}"
    labels:
      graphgo.ignore: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - graph-go

  rustfs-init:
    image: rustfs/rustfs:1.0.0
    labels:
      graphgo.ignore: "true"
    environment:
      RUSTFS_ACCESS_KEY: graphgo
      RUSTFS_SECRET_KEY: graphgo-secret
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./docker/init-rustfs.sh:/init-rustfs.sh:ro
    entrypoint: /bin/sh
    command: /init-rustfs.sh
    networks:
      - graph-go

volumes:
  backend-data:
  postgres-data:
  mongo-data:
  rustfs-data:

networks:
  graph-go:
    driver: bridge
