# graph-go Configuration
#
# This file defines the server settings, discovery options, and the data sources
# that graph-go will connect to and visualize. Copy this file to config.yaml and
# fill in your connection details.
#
# Auto-discovery is the default path — mount the Docker socket and/or run inside
# Kubernetes and graph-go discovers your infrastructure with NO config file.
# Use this file only as an escape hatch for services discovery can't reach:
# remote databases, managed cloud services, external endpoints.
#
# IMPORTANT: This tool is intended for authorized infrastructure visualization and
# monitoring. Only configure connections to systems you own or have permission to access.

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
# HTTP server settings. All fields optional; defaults shown.
#
# server:
#   port: 8080                              # bind port (or set PORT env var)
#   allowed_origins:                        # CORS allowlist for /api/* and /websocket
#     - "http://localhost:5173"             # Vite dev server
#     - "https://ops.example.com"           # any explicit origin you serve the UI from

# ─────────────────────────────────────────────────────────────────────────────
# Docker discovery
# ─────────────────────────────────────────────────────────────────────────────
# graph-go reads the Docker socket (mounted read-only). All fields optional;
# omitted values fall back to auto-detection.
#
# docker:
#   enabled: true                           # nil = auto-detect (default); force on/off
#   socket: /var/run/docker.sock            # default: /var/run/docker.sock
#   network: graph-go                       # limit discovery to a single Docker network
#   ignore_images:                          # skip containers whose image matches any entry
#     - "grafana/grafana"

# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes discovery
# ─────────────────────────────────────────────────────────────────────────────
# graph-go uses in-cluster credentials by default, falling back to kubeconfig.
# Set enabled: false to disable K8s discovery even when running in a cluster.
# All fields optional.
#
# kubernetes:
#   enabled: true                           # nil = auto-detect (default)
#   kubeconfig: ~/.kube/config              # path override; empty = default lookup (~/.kube/config or KUBECONFIG)
#   context: my-cluster                     # empty = current context
#   namespaces:                             # empty = all namespaces
#     - default
#     - production

connections:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers databases, tables, and foreign key relationships.
  #
  # Required fields:
  #   - name: Unique identifier for this connection (used in node IDs and logs)
  #   - type: Must be "postgres"
  #   - dsn:  PostgreSQL connection string (format: postgres://user:pass@host:port/db?options)
  #
  # The adapter will:
  #   - Create a database node
  #   - Discover all tables in the "public" schema
  #   - Map foreign key relationships as edges
  #
  - name: postgres
    type: postgres
    dsn: "postgres://user:password@localhost:5432/mydb?sslmode=disable"
    # Options in DSN:
    #   sslmode: disable, require, verify-ca, verify-full
    #   connect_timeout: Connection timeout in seconds
    #   application_name: Name shown in pg_stat_activity

  # ─────────────────────────────────────────────────────────────────────────────
  # MySQL Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers databases, tables, and foreign key relationships.
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "mysql"
  #   - dsn:  MySQL connection string (format: user:pass@tcp(host:port)/db?params)
  #
  # The adapter will:
  #   - Create a database node
  #   - Discover tables in each accessible database
  #   - Map foreign key relationships as edges
  #
  # - name: mysql
  #   type: mysql
  #   dsn: "user:password@tcp(localhost:3306)/mydb?parseTime=true"
  #   # DSN params:
  #   #   parseTime: parse DATE/DATETIME into time.Time (recommended)
  #   #   timeout: dial timeout (e.g., 10s)

  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers databases and collections (excludes system databases: admin, config, local).
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "mongodb"
  #   - uri:  MongoDB connection URI (format: mongodb://user:pass@host:port[,host2:port2])
  #
  # The adapter will:
  #   - List all non-system databases
  #   - Discover collections within each database
  #   - Create "contains" edges between databases and collections
  #
  - name: mongodb
    type: mongodb
    uri: "mongodb://user:password@localhost:27017"
    # URI options:
    #   authSource: Authentication database (default: admin)
    #   replicaSet: Replica set name for clustered deployments
    #   tls: Enable TLS (true/false)
    #   connectTimeoutMS: Connection timeout in milliseconds

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers keyspaces and active key distribution via INFO keyspace.
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "redis"
  #   - uri:  Redis connection URI (mutually exclusive with endpoint)
  #   OR
  #   - endpoint: host:port (e.g., localhost:6379) — paired with password below
  #   - password: optional, for AUTH (only used with endpoint)
  #
  # The adapter will:
  #   - List keyspaces with key counts from INFO keyspace
  #   - Create a keyspace node per keyspace
  #   - Report health based on PING
  #
  # - name: redis
  #   type: redis
  #   uri: "redis://:password@localhost:6379"
  #   # --- OR (host/port style) ---
  #   # endpoint: "localhost:6379"
  #   # password: "secret"

  # ─────────────────────────────────────────────────────────────────────────────
  # Elasticsearch Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers indices, cluster health, and shard status.
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "elasticsearch"
  #   - endpoint: Elasticsearch URL (e.g., http://localhost:9200 or https://...)
  # Optional:
  #   - username: basic-auth username
  #   - password: basic-auth password
  #
  # The adapter will:
  #   - Create an index node per index
  #   - Surface cluster health (green/yellow/red) as the service health
  #   - Report shard status metadata
  #
  # - name: elasticsearch
  #   type: elasticsearch
  #   endpoint: "http://localhost:9200"
  #   username: "elastic"
  #   password: "secret"

  # ─────────────────────────────────────────────────────────────────────────────
  # S3 / AWS Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Discovers S3 buckets and top-level prefixes (folders).
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "s3"
  #   - region: AWS region (e.g., us-east-1, eu-west-1)
  #   - access_key_id: AWS access key ID (or use IAM role if running on EC2/ECS)
  #   - secret_access_key: AWS secret access key
  #
  # The adapter will:
  #   - List all S3 buckets
  #   - Discover top-level prefixes (using "/" delimiter)
  #   - Create "contains" edges between buckets and prefixes
  #
  - name: s3
    type: s3
    region: us-east-1
    access_key_id: "AKIAIOSFODNN7EXAMPLE"
    secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    # Optional: Leave credentials empty to use IAM role (EC2, ECS, Lambda)

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO / S3-Compatible Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Same as S3 adapter, but with a custom endpoint for S3-compatible services.
  #
  # Required fields:
  #   - name: Unique identifier for this connection
  #   - type: Must be "s3"
  #   - region: Region (can be any value for MinIO, e.g., us-east-1)
  #   - endpoint: HTTP(S) URL to the S3-compatible service (e.g., http://localhost:9000)
  #   - access_key_id: Access key for MinIO/S3-compatible service
  #   - secret_access_key: Secret key for MinIO/S3-compatible service
  #
  # Use this for:
  #   - MinIO (self-hosted S3-compatible object storage)
  #   - LocalStack (local AWS emulator)
  #   - Ceph RADOS Gateway
  #   - Any other S3-compatible service
  #
  # - name: minio
  #   type: s3
  #   region: us-east-1
  #   endpoint: "http://localhost:9000"
  #   access_key_id: minioadmin
  #   secret_access_key: minioadmin

  # ─────────────────────────────────────────────────────────────────────────────
  # HTTP / Application Service Adapter
  # ─────────────────────────────────────────────────────────────────────────────
  # Monitors any HTTP service with a health endpoint and maps its dependencies
  # to infrastructure nodes already discovered by other adapters.
  #
  # Required fields:
  #   - name: Unique identifier (becomes the node ID in the graph)
  #   - type: Must be "http"
  #   - endpoint: Base URL of the service (e.g., http://my-service:8080)
  #
  # Optional fields:
  #   - health_path: Path to health endpoint (default: /health)
  #   - node_type: Visual node type — service, gateway, auth, api, queue, cache (default: service)
  #   - depends_on: List of infrastructure node IDs this service connects to
  #
  # The adapter will:
  #   - Ping the health endpoint on startup to verify reachability
  #   - Create a single top-level node (no wrapper — the node IS the entity)
  #   - Create "depends_on" edges to each target in depends_on
  #   - Report health based on HTTP status: 2xx=healthy, 5xx=unhealthy, else=degraded
  #
  # - name: api-gateway
  #   type: http
  #   endpoint: "http://api-gateway:8080"
  #   health_path: /health
  #   node_type: gateway
  #   depends_on:
  #     - target: user-service
  #       label: routes
  #     - target: order-service
  #       label: routes

# ─────────────────────────────────────────────────────────────────────────────
# Usage Notes
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Connection Names:
#    - Must be unique across all connections
#    - Used as node IDs (e.g., "service-postgres")
#    - Appear in logs and error messages
#
# 2. Health Checks:
#    - Each adapter pings its service on a health sweep
#    - Health status is streamed to the frontend via WebSocket
#    - Status values: healthy, degraded, unhealthy
#
# 3. Caching:
#    - Graph discovery results are cached for 30 seconds
#    - Health is cached for 10 seconds
#    - Caches are invalidated on adapter registration and discovery events
#
# 4. Security:
#    - Store credentials in environment variables for production
#    - Use IAM roles instead of static credentials when possible
#    - Never commit config.yaml with real credentials to version control
#
# 5. Troubleshooting:
#    - Check logs for connection errors on startup
#    - Verify network connectivity (firewalls, security groups)
#    - Test connections manually before adding to config
#
# 6. Authorization:
#    - Only configure connections to systems you own or have permission to access
#    - This tool is designed for authorized infrastructure visualization
#    - Respect security policies and access controls