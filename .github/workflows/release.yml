name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published until the tagged commit passes the same tests as CI.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Integration tests
        run: |
          pkgs=$(grep -rl --include='*_test.go' '^//go:build integration' . | xargs -n1 dirname | sort -u)
          # shellcheck disable=SC2086 # one package per word
          go test -tags=integration -count=1 -timeout=10m $pkgs

  goreleaser:
    name: Build & Release Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Build embedded frontend bundle
        run: make build-frontend

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Prereleases (v0.4.0-rc.1) must not move :latest.
          if [[ "$tag" == *-* ]]; then
            echo "latest=" >> "$GITHUB_OUTPUT"
          else
            echo "latest=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build date
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # arm64 is built under QEMU. The Dockerfile deliberately avoids
      # BuildKit-only syntax (--platform=$BUILDPLATFORM, RUN --mount) so it
      # still builds with the classic builder that `graph-go demo` falls back
      # to on hosts without buildx.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Tag-scoped caches aren't shared across tags, so also start from
          # the nightly build on main.
          cache-from: |
            type=gha,scope=release
            type=gha,scope=nightly
          cache-to: type=gha,scope=release,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.latest }}
